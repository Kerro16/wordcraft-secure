name: Security audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe-imports:
    runs-on: windows-latest
    steps:
      - name: Imports of the latest released exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R Kerro16/wordcraft-secure -p '*.zip'
          Expand-Archive wordcraft-portable-windows-x64.zip -DestinationPath rel
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like '*Hostx64*x64*' } | Select-Object -First 1).FullName
          Write-Output "dumpbin: $dumpbin"
          foreach ($exe in 'wordcraft.exe','wordcraft-cli.exe') {
            Write-Output "=== DLL dependencies: $exe ==="
            & $dumpbin /dependents "rel/wordcraft-portable/$exe"
            Write-Output "=== network-related imports: $exe ==="
            & $dumpbin /imports "rel/wordcraft-portable/$exe" | Select-String -Pattern 'ws2_32|winhttp|wininet|urlmon|dnsapi|iphlpapi|WSAStartup|getaddrinfo|InternetOpen|WinHttp|connect'
          }
          Write-Output "=== URLs embedded in wordcraft.exe ==="
          $bytes = [IO.File]::ReadAllBytes("rel/wordcraft-portable/wordcraft.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          [regex]::Matches($text, 'https?://[A-Za-z0-9._~:/?#@!$&''()*+,;=%-]{4,120}') | ForEach-Object { $_.Value } | Sort-Object -Unique | Where-Object { $_ -notmatch 'w3\.org|schemas\.|microsoft\.com|openxmlformats|purl\.org|apache\.org|unicode\.org|example\.' }
